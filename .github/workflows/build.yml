name: Build AIFRED Beta

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: aifred-beta-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  vst3:
    name: VST3 Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build, test, and package Beta
        shell: pwsh
        run: ./scripts/windows/build.ps1 -Action release -SkipGuiTests

      - name: Dump release layout on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "Repository root: $(Get-Location)"
          if (Test-Path -LiteralPath 'out') {
            Get-ChildItem -LiteralPath 'out' -Recurse -Force |
              Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host 'The out directory was not created.'
          }

      - name: Upload validated Beta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIFRED-VST3-windows
          path: |
            out/windows-x64/current/AIFRED-VST3-windows.zip
            out/windows-x64/current/installer/AIFRED-VST3-Setup.exe
            out/windows-x64/current/uninstaller/AIFRED-Uninstall.exe
          if-no-files-found: error

      - name: Upload Windows source manifest
        uses: actions/upload-artifact@v4
        with:
          name: windows-source-manifest
          path: out/windows-x64/current/manifest.json
          if-no-files-found: error

  macos:
    name: VST3 macOS Apple silicon
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select C++20-capable Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Install build tools
        run: brew install ninja
      - name: Build, test, and package Beta
        run: bash scripts/macos/build.sh release --skip-gui-tests
      - name: Verify DMG and installer payload
        run: bash scripts/macos/verify-package.sh --install-smoke-test
      - name: Upload installer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-diagnostics
          path: ~/Library/Application Support/Aifred/beta/logs
          if-no-files-found: ignore
      - name: Upload validated Beta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIFRED-VST3-macos
          path: out/macos-arm64/package/AIFRED-VST3-macos-arm64.dmg
          if-no-files-found: error
      - name: Upload macOS source manifest
        uses: actions/upload-artifact@v4
        with:
          name: macos-source-manifest
          path: out/macos-arm64/current/manifest.json
          if-no-files-found: error

  release:
    name: Publish GitHub Beta release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [vst3, macos]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: AIFRED-VST3-windows
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: AIFRED-VST3-macos
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: windows-source-manifest
          path: manifests/windows
      - uses: actions/download-artifact@v4
        with:
          name: macos-source-manifest
          path: manifests/macos
      - name: Verify identical source revision and publish current release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.3.6-beta-installers
        run: python3 scripts/common/publish-beta.py
